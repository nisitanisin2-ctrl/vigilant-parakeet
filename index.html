<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>菜園ノート</title>
<meta name="apple-mobile-web-app-title" content="菜園ノート">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2e7d32">
<style>
:root {
  --acc: #2e7d32; --acc-soft: rgba(46,125,50,.12); --acc-ink: #fff;
  --bg: #f1f4ee; --panel: #fff; --text: #263022; --muted: #6b7768;
  --line: rgba(80,100,70,.20); --chip: rgba(80,100,70,.10);
  --warn: #e65100; --warn-soft: rgba(230,81,0,.12); --danger: #c62828;
  --water: #1565c0; --water-soft: rgba(21,101,192,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --acc: #66bb6a; --acc-soft: rgba(102,187,106,.18); --acc-ink: #10210f;
    --bg: #121811; --panel: #1b2419; --text: #e6eee2; --muted: #9aab95;
    --line: rgba(160,190,150,.22); --chip: rgba(160,190,150,.12);
    --warn: #ffb74d; --warn-soft: rgba(255,183,77,.15); --danger: #ef5350;
    --water: #64b5f6; --water-soft: rgba(100,181,246,.16);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--acc); color: var(--acc-ink);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 8px;
}
header h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 700; }
header .back { background: none; border: 0; color: inherit; font-size: 16px; padding: 4px 8px 4px 0; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 12px 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--chip); font-weight: 600; }
.btn.primary { background: var(--acc); color: var(--acc-ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; align-items: center; }
.muted { color: var(--muted); font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty .big { font-size: 48px; }

/* 絞り込み */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }

/* 野菜カード */
.card { background: var(--panel); border-radius: 14px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); }
.crop { display: flex; gap: 12px; align-items: center; }
.crop .emo { font-size: 36px; width: 52px; height: 52px; display: grid; place-items: center; background: var(--acc-soft); border-radius: 12px; flex-shrink: 0; }
.crop .info { flex: 1; min-width: 0; cursor: pointer; }
.crop .name { font-weight: 700; font-size: 17px; }
.crop .name small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
.badge.water { background: var(--water-soft); color: var(--water); }
.badge.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.badge.acc { background: var(--acc-soft); color: var(--acc); font-weight: 600; }
.quick { display: flex; flex-direction: column; gap: 6px; }
.quick button { border: 0; border-radius: 10px; width: 48px; height: 40px; font-size: 20px; background: var(--chip); }
.quick .w { background: var(--water-soft); }

/* 記録 */
.log { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log:last-child { border-bottom: 0; }
.log .ic { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
.log .body { flex: 1; min-width: 0; }
.log .meta { font-size: 13px; color: var(--muted); }
.log .memo { white-space: pre-wrap; word-break: break-word; }
.log img { display: block; max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 6px; cursor: pointer; }
.log .edit { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 0 4px; align-self: flex-start; }
.dayhead { font-weight: 700; color: var(--muted); font-size: 13px; margin: 14px 0 4px; }

/* 詳細 */
.detail-top { display: flex; gap: 14px; align-items: center; }
.detail-top .emo { font-size: 52px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--acc-soft); border-radius: 12px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; color: var(--acc); }
.stat span { font-size: 12px; color: var(--muted); }
h2 { font-size: 16px; margin: 18px 0 8px; }

/* 集計 */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
td.num, th.num { text-align: right; white-space: nowrap; }

/* 下のタブ */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 12px; color: var(--muted); }
nav.tabs button .i { display: block; font-size: 22px; line-height: 1.2; }
nav.tabs button.on { color: var(--acc); font-weight: 700; }
.fab {
  position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 15;
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--acc); color: var(--acc-ink);
  font-size: 30px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
}

/* モーダル */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--panel); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
}
@media (min-width: 600px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=date], input[type=number], textarea, select {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 15px; }
.pick button.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.pick.emoji button { font-size: 24px; padding: 4px 8px; }
.photo-prev { max-width: 100%; max-height: 200px; border-radius: 10px; margin-top: 8px; display: block; }
.sheet .actions { display: flex; gap: 8px; margin-top: 18px; }
.sheet .actions .btn { flex: 1; }
.viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: grid; place-items: center; }
.viewer img { max-width: 100vw; max-height: 100vh; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 70; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none; width: max-content; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" hidden>‹ 戻る</button>
  <h1 id="title">菜園ノート</h1>
</header>
<main id="main"></main>
<button class="fab" id="fab" aria-label="追加">＋</button>
<nav class="tabs">
  <button data-tab="crops" class="on"><span class="i">🌱</span>畑</button>
  <button data-tab="logs"><span class="i">📝</span>記録</button>
  <button data-tab="summary"><span class="i">📊</span>集計</button>
  <button data-tab="settings"><span class="i">⚙️</span>設定</button>
</nav>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ===== 定数 ===== */
const PRESETS = [
  ['🍅','トマト'],['🍒','ミニトマト'],['🥒','キュウリ'],['🍆','ナス'],['🫑','ピーマン'],['🌶️','トウガラシ'],
  ['🥕','ニンジン'],['🥬','葉物'],['🥦','ブロッコリー'],['🧅','タマネギ'],['🧄','ニンニク'],['🥔','ジャガイモ'],
  ['🍠','サツマイモ'],['🌽','トウモロコシ'],['🫛','エダマメ・豆'],['🍓','イチゴ'],['🍉','スイカ'],['🎃','カボチャ'],
  ['🌿','ハーブ'],['🌱','その他']
];
const TYPES = {
  water:     { icon: '💧', label: '水やり' },
  fertilize: { icon: '🧪', label: '追肥' },
  harvest:   { icon: '🧺', label: '収穫' },
  weed:      { icon: '✂️', label: '除草・手入れ' },
  spray:     { icon: '🐛', label: '病害虫・消毒' },
  observe:   { icon: '👀', label: '観察' },
  other:     { icon: '📌', label: 'その他' }
};
const STATUS = { growing: '育成中', harvesting: '収穫中', done: '終了' };
const UNITS = ['個', 'g', 'kg', '本', '株', '束'];
const WATER_WARN_DAYS = 3;   // この日数以上水やりしていなければ目立たせる

/* ===== 保存（IndexedDB） ===== */
const DB_NAME = 'saien-note', STORE = 'kv';
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function kvGet(key) {
  const d = await db();
  return new Promise((res, rej) => {
    const r = d.transaction(STORE).objectStore(STORE).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvSet(key, val) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, 'readwrite');
    if (val === undefined) t.objectStore(STORE).delete(key); else t.objectStore(STORE).put(val, key);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

let data = { crops: [], logs: [] };
async function load() {
  try { data = (await kvGet('data')) || { crops: [], logs: [] }; }
  catch (e) { toast('データを読み込めませんでした'); }
  data.crops = data.crops || []; data.logs = data.logs || [];
}
async function save() {
  try { await kvSet('data', data); }
  catch (e) { alert('保存に失敗しました：' + e.message); }
}
const photoCache = new Map();
async function getPhoto(id) {
  if (photoCache.has(id)) return photoCache.get(id);
  const v = await kvGet('photo:' + id); photoCache.set(id, v); return v;
}
async function setPhoto(id, url) { photoCache.set(id, url); await kvSet('photo:' + id, url); }

/* ===== 便利関数 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000); }
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00');
  return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`;
}
function fmtDateLong(s) { const d = new Date(s + 'T00:00'); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`; }
function ago(s) {
  const n = daysBetween(s, today());
  return n === 0 ? '今日' : n === 1 ? '昨日' : n > 0 ? `${n}日前` : `${-n}日後`;
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
const cropById = id => data.crops.find(c => c.id === id);
const logsOf = id => data.logs.filter(l => l.cropId === id).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
function lastOf(id, type) { return logsOf(id).find(l => l.type === type); }
function harvestTotals(logs) {
  const t = {};
  logs.filter(l => l.type === 'harvest' && l.amount > 0).forEach(l => { t[l.unit] = (t[l.unit] || 0) + Number(l.amount); });
  return Object.entries(t).map(([u, v]) => `${Math.round(v * 100) / 100}${u}`).join('・');
}

/* 写真を縮小してJPEGに（容量を抑える） */
function shrinkImage(file, max = 1280, q = 0.75) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

/* ===== 画面状態 ===== */
let view = { tab: 'crops', cropId: null };
let cropFilter = 'active';

function go(tab, cropId = null) { view = { tab, cropId }; render(); window.scrollTo(0, 0); }
$('#backBtn').onclick = () => go('crops');
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#fab').onclick = () => {
  if (view.cropId) openLogForm({ cropId: view.cropId });
  else if (view.tab === 'logs') openLogForm({});
  else openCropForm();
};

function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === view.tab));
  $('#backBtn').hidden = !view.cropId;
  $('#fab').hidden = view.tab === 'summary' || view.tab === 'settings';
  const m = $('#main');
  if (view.cropId && cropById(view.cropId)) return renderDetail(m);
  view.cropId = null;
  ({ crops: renderCrops, logs: renderLogs, summary: renderSummary, settings: renderSettings })[view.tab](m);
}

/* ----- 畑（野菜一覧） ----- */
function renderCrops(m) {
  $('#title').textContent = '菜園ノート';
  const list = data.crops.filter(c => cropFilter === 'all' ? true : cropFilter === 'done' ? c.status === 'done' : c.status !== 'done')
    .sort((a, b) => (a.status === 'done') - (b.status === 'done') || (b.plantedAt || '').localeCompare(a.plantedAt || ''));
  const f = [['active', '育てている'], ['done', '終了'], ['all', 'すべて']];
  let h = `<div class="filters">${f.map(([k, l]) => `<button class="chip ${cropFilter === k ? 'on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>`;
  if (!data.crops.length) {
    h += `<div class="empty"><div class="big">🌱</div><p>まだ野菜が登録されていません。<br>右下の「＋」から植えた野菜を登録しましょう。</p></div>`;
  } else if (!list.length) {
    h += `<div class="empty">該当する野菜はありません</div>`;
  }
  list.forEach(c => {
    const lw = lastOf(c.id, 'water');
    const tot = harvestTotals(logsOf(c.id));
    const badges = [];
    badges.push(`<span class="badge ${c.status === 'harvesting' ? 'acc' : ''}">${STATUS[c.status]}</span>`);
    if (c.plantedAt) badges.push(`<span class="badge">植付から${Math.max(0, daysBetween(c.plantedAt, today()))}日</span>`);
    if (c.status !== 'done') {
      if (lw) {
        const n = daysBetween(lw.date, today());
        badges.push(`<span class="badge ${n >= WATER_WARN_DAYS ? 'warn' : 'water'}">💧${ago(lw.date)}</span>`);
      } else badges.push(`<span class="badge warn">💧記録なし</span>`);
    }
    if (tot) badges.push(`<span class="badge acc">🧺${tot}</span>`);
    h += `<div class="card crop">
      <div class="emo">${c.emoji}</div>
      <div class="info" data-open="${c.id}">
        <div class="name">${esc(c.name)}${c.variety ? `<small>${esc(c.variety)}</small>` : ''}</div>
        ${c.place ? `<div class="muted">📍${esc(c.place)}</div>` : ''}
        <div class="badges">${badges.join('')}</div>
      </div>
      ${c.status !== 'done' ? `<div class="quick">
        <button class="w" data-water="${c.id}" aria-label="今日水やりした">💧</button>
        <button data-log="${c.id}" aria-label="記録を追加">✏️</button>
      </div>` : ''}
    </div>`;
  });
  m.innerHTML = h;
  m.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cropFilter = b.dataset.f; render(); });
  m.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('crops', b.dataset.open));
  m.querySelectorAll('[data-log]').forEach(b => b.onclick = () => openLogForm({ cropId: b.dataset.log }));
  m.querySelectorAll('[data-water]').forEach(b => b.onclick = () => quickWater(b.dataset.water));
}

async function quickWater(cropId) {
  const exists = data.logs.some(l => l.cropId === cropId && l.type === 'water' && l.date === today());
  if (exists && !confirm('今日はすでに水やりを記録しています。もう1件記録しますか？')) return;
  data.logs.push({ id: uid(), cropId, type: 'water', date: today(), memo: '', ts: Date.now() });
  await save(); render(); toast(`💧 ${cropById(cropId).name} に水やりを記録しました`);
}

/* ----- 野菜の詳細 ----- */
async function renderDetail(m) {
  const c = cropById(view.cropId);
  $('#title').textContent = c.name;
  const logs = logsOf(c.id);
  const lw = logs.find(l => l.type === 'water');
  const tot = harvestTotals(logs);
  let h = `<div class="card">
    <div class="detail-top">
      <div class="emo">${c.emoji}</div>
      <div style="flex:1;min-width:0">
        <div class="name" style="font-size:20px;font-weight:700">${esc(c.name)}</div>
        ${c.variety ? `<div class="muted">品種：${esc(c.variety)}</div>` : ''}
        ${c.place ? `<div class="muted">📍${esc(c.place)}</div>` : ''}
        ${c.plantedAt ? `<div class="muted">植付：${fmtDateLong(c.plantedAt)}</div>` : ''}
      </div>
      <button class="btn" id="editCrop">編集</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${c.plantedAt ? Math.max(0, daysBetween(c.plantedAt, today())) : '-'}</b><span>植付からの日数</span></div>
      <div class="stat"><b>${lw ? ago(lw.date) : '-'}</b><span>最後の水やり</span></div>
      <div class="stat"><b style="font-size:${tot.length > 6 ? 14 : 20}px">${tot || '-'}</b><span>収穫合計</span></div>
    </div>
    <div class="pick" id="statusPick">${Object.entries(STATUS).map(([k, l]) => `<button data-s="${k}" class="${c.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${c.memo ? `<p class="memo" style="white-space:pre-wrap;margin:12px 0 0">${esc(c.memo)}</p>` : ''}
  </div>
  <div class="row">
    <button class="btn" style="flex:1;background:var(--water-soft);color:var(--water)" id="dWater">💧 今日水やり</button>
    <button class="btn primary" style="flex:1" id="dLog">＋ 記録を追加</button>
  </div>
  <h2>記録（${logs.length}件）</h2>
  <div class="card" id="logList">${logs.length ? logs.map(l => logHtml(l, false)).join('') : '<div class="empty" style="padding:16px">まだ記録はありません</div>'}</div>`;
  m.innerHTML = h;
  $('#editCrop').onclick = () => openCropForm(c);
  $('#dWater').onclick = () => quickWater(c.id);
  $('#dLog').onclick = () => openLogForm({ cropId: c.id });
  m.querySelectorAll('#statusPick button').forEach(b => b.onclick = async () => {
    c.status = b.dataset.s; await save(); render(); toast(`「${STATUS[c.status]}」にしました`);
  });
  bindLogList(m);
}

function logHtml(l, showCrop) {
  const t = TYPES[l.type] || TYPES.other;
  const c = cropById(l.cropId);
  const amt = l.type === 'harvest' && l.amount ? ` <b>${l.amount}${esc(l.unit)}</b>` : '';
  return `<div class="log">
    <div class="ic">${t.icon}</div>
    <div class="body">
      <div><b>${t.label}</b>${amt}${showCrop && c ? ` <span class="muted">${c.emoji}${esc(c.name)}</span>` : ''}</div>
      <div class="meta">${fmtDate(l.date)}${showCrop ? '' : '・' + ago(l.date)}</div>
      ${l.memo ? `<div class="memo">${esc(l.memo)}</div>` : ''}
      ${l.hasPhoto ? `<img data-photo="${l.id}" alt="写真" loading="lazy">` : ''}
    </div>
    <button class="edit" data-edit="${l.id}" aria-label="編集">⋯</button>
  </div>`;
}
function bindLogList(m) {
  m.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openLogForm(data.logs.find(l => l.id === b.dataset.edit)));
  m.querySelectorAll('img[data-photo]').forEach(async img => {
    const url = await getPhoto(img.dataset.photo);
    if (url) { img.src = url; img.onclick = () => showViewer(url); } else img.remove();
  });
}
function showViewer(url) {
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${url}" alt="">`; v.onclick = () => v.remove();
  document.body.appendChild(v);
}

/* ----- 記録（全体のタイムライン） ----- */
let logTypeFilter = 'all';
function renderLogs(m) {
  $('#title').textContent = '作業記録';
  const logs = data.logs.filter(l => cropById(l.cropId) && (logTypeFilter === 'all' || l.type === logTypeFilter))
    .sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  let h = `<div class="filters"><button class="chip ${logTypeFilter === 'all' ? 'on' : ''}" data-t="all">すべて</button>${
    Object.entries(TYPES).map(([k, t]) => `<button class="chip ${logTypeFilter === k ? 'on' : ''}" data-t="${k}">${t.icon}${t.label}</button>`).join('')}</div>`;
  if (!logs.length) h += `<div class="empty"><div class="big">📝</div><p>記録はまだありません</p></div>`;
  let day = null, open = false;
  logs.slice(0, 300).forEach(l => {
    if (l.date !== day) {
      if (open) h += '</div>';
      day = l.date; h += `<div class="dayhead">${fmtDateLong(l.date)}・${ago(l.date)}</div><div class="card">`; open = true;
    }
    h += logHtml(l, true);
  });
  if (open) h += '</div>';
  if (logs.length > 300) h += `<p class="muted" style="text-align:center">最新300件を表示しています</p>`;
  m.innerHTML = h;
  m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { logTypeFilter = b.dataset.t; render(); });
  bindLogList(m);
}

/* ----- 集計 ----- */
function renderSummary(m) {
  $('#title').textContent = '集計';
  const years = [...new Set(data.logs.map(l => l.date.slice(0, 4)))].sort().reverse();
  if (!renderSummary.year || !years.includes(renderSummary.year)) renderSummary.year = years[0] || today().slice(0, 4);
  const y = renderSummary.year;
  const ylogs = data.logs.filter(l => l.date.startsWith(y) && cropById(l.cropId));
  let h = years.length > 1 ? `<div class="filters">${years.map(v => `<button class="chip ${v === y ? 'on' : ''}" data-y="${v}">${v}年</button>`).join('')}</div>` : '';
  h += `<h2>${y}年の収穫</h2><div class="card">`;
  const rows = data.crops.map(c => {
    const ls = ylogs.filter(l => l.cropId === c.id);
    const hv = ls.filter(l => l.type === 'harvest');
    return { c, tot: harvestTotals(ls), times: hv.length, first: hv.map(l => l.date).sort()[0], last: hv.map(l => l.date).sort().pop() };
  }).filter(r => r.times);
  if (rows.length) {
    h += `<table><tr><th>野菜</th><th class="num">回数</th><th class="num">合計</th><th class="num">期間</th></tr>${
      rows.map(r => `<tr><td>${r.c.emoji} ${esc(r.c.name)}</td><td class="num">${r.times}回</td><td class="num">${r.tot || '-'}</td><td class="num">${fmtDate(r.first).replace(/\(.\)/, '')}〜${fmtDate(r.last).replace(/\(.\)/, '')}</td></tr>`).join('')}</table>`;
  } else h += `<div class="empty" style="padding:16px">収穫の記録はまだありません</div>`;
  h += `</div><h2>${y}年の作業回数</h2><div class="card"><table><tr><th>作業</th><th class="num">回数</th></tr>${
    Object.entries(TYPES).map(([k, t]) => `<tr><td>${t.icon} ${t.label}</td><td class="num">${ylogs.filter(l => l.type === k).length}回</td></tr>`).join('')}</table></div>`;
  // 月別の収穫回数（簡易グラフ）
  const months = Array.from({ length: 12 }, (_, i) => ylogs.filter(l => l.type === 'harvest' && Number(l.date.slice(5, 7)) === i + 1).length);
  const mx = Math.max(1, ...months);
  h += `<h2>月別の収穫回数</h2><div class="card"><div style="display:flex;align-items:flex-end;gap:4px;height:110px">${
    months.map((n, i) => `<div style="flex:1;text-align:center;font-size:11px;color:var(--muted)">
      <div style="font-size:11px">${n || ''}</div>
      <div style="height:${Math.round(n / mx * 70)}px;background:var(--acc);border-radius:4px 4px 0 0;min-height:${n ? 4 : 0}px"></div>
      <div>${i + 1}</div></div>`).join('')}</div></div>`;
  m.innerHTML = h;
  m.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { renderSummary.year = b.dataset.y; render(); });
}

/* ----- 設定（バックアップ） ----- */
async function renderSettings(m) {
  $('#title').textContent = '設定';
  let est = '';
  try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); est = `使用容量：約${(e.usage / 1048576).toFixed(1)}MB`; } } catch (e) {}
  m.innerHTML = `<h2>データ</h2><div class="card">
    <p style="margin-top:0">野菜 ${data.crops.length}件・記録 ${data.logs.length}件・写真 ${data.logs.filter(l => l.hasPhoto).length}枚</p>
    <p class="muted">${est}<br>データはこの端末のブラウザ内だけに保存されます。機種変更やブラウザのデータ削除に備えて、ときどきバックアップしてください。</p>
    <button class="btn primary block" id="exp">📤 バックアップを保存（写真込み）</button>
    <div style="height:8px"></div>
    <button class="btn block" id="imp">📥 バックアップから復元</button>
  </div>
  <h2>このアプリについて</h2><div class="card"><p class="muted" style="margin:0">菜園ノート：家庭菜園の植付・水やり・追肥・収穫などを記録するアプリです。ホーム画面に追加するとアプリとして使え、オフラインでも動きます。</p></div>`;
  $('#exp').onclick = exportData;
  $('#imp').onclick = () => $('#importFile').click();
}
async function exportData() {
  const photos = {};
  for (const l of data.logs) if (l.hasPhoto) { const p = await getPhoto(l.id); if (p) photos[l.id] = p; }
  const blob = new Blob([JSON.stringify({ app: 'saien-note', version: 1, exportedAt: new Date().toISOString(), data, photos })], { type: 'application/json' });
  const name = `菜園ノート_${today()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'saien-note' || !j.data) throw new Error('菜園ノートのバックアップではありません');
    if (!confirm(`野菜${j.data.crops.length}件・記録${j.data.logs.length}件で、今のデータを置き換えます。よろしいですか？`)) return;
    for (const l of data.logs) if (l.hasPhoto) await kvSet('photo:' + l.id, undefined);
    photoCache.clear();
    data = j.data;
    for (const [id, url] of Object.entries(j.photos || {})) await setPhoto(id, url);
    await save(); go('crops'); toast('復元しました');
  } catch (err) { alert('復元できませんでした：' + err.message); }
};

/* ===== モーダル ===== */
function openModal(html) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`;
  const md = root.firstElementChild;
  md.addEventListener('click', e => { if (e.target === md) closeModal(); });
  return md.firstElementChild;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

/* ----- 野菜の登録・編集 ----- */
function openCropForm(c) {
  const isNew = !c;
  c = c || { emoji: '🍅', name: '', variety: '', place: '', plantedAt: today(), status: 'growing', memo: '' };
  const s = openModal(`<h3>${isNew ? '野菜を登録' : '野菜を編集'}</h3>
    <label class="f">種類（タップで名前も入ります）</label>
    <div class="pick emoji" id="emo">${PRESETS.map(([e, n]) => `<button type="button" data-e="${e}" data-n="${n}" title="${n}" class="${c.emoji === e ? 'on' : ''}">${e}</button>`).join('')}</div>
    <label class="f">名前</label><input type="text" id="cName" value="${esc(c.name)}" placeholder="例：トマト">
    <label class="f">品種（任意）</label><input type="text" id="cVar" value="${esc(c.variety)}" placeholder="例：桃太郎">
    <label class="f">場所（任意）</label><input type="text" id="cPlace" value="${esc(c.place)}" placeholder="例：南の畝・プランター1">
    <label class="f">植付日・種まき日</label><input type="date" id="cDate" value="${esc(c.plantedAt)}">
    <label class="f">メモ（任意）</label><textarea id="cMemo" placeholder="苗の購入先、株間など">${esc(c.memo)}</textarea>
    <div class="actions"><button class="btn" id="cCancel">やめる</button><button class="btn primary" id="cSave">${isNew ? '登録' : '保存'}</button></div>
    ${isNew ? '' : '<div style="margin-top:16px"><button class="btn danger block" id="cDel">この野菜を削除</button></div>'}`);
  let emoji = c.emoji;
  s.querySelectorAll('#emo button').forEach(b => b.onclick = () => {
    s.querySelectorAll('#emo button').forEach(x => x.classList.remove('on')); b.classList.add('on'); emoji = b.dataset.e;
    const nm = $('#cName'); const names = PRESETS.map(p => p[1]);
    if (!nm.value.trim() || names.includes(nm.value.trim())) nm.value = b.dataset.n === 'その他' ? '' : b.dataset.n;
  });
  $('#cCancel').onclick = closeModal;
  $('#cSave').onclick = async () => {
    const name = $('#cName').value.trim();
    if (!name) { $('#cName').focus(); toast('名前を入れてください'); return; }
    Object.assign(c, { emoji, name, variety: $('#cVar').value.trim(), place: $('#cPlace').value.trim(), plantedAt: $('#cDate').value, memo: $('#cMemo').value.trim() });
    if (isNew) { c.id = uid(); c.createdAt = Date.now(); data.crops.push(c); }
    await save(); closeModal();
    if (isNew) { cropFilter = 'active'; go('crops'); toast(`${c.emoji} ${c.name} を登録しました`); } else render();
  };
  if (!isNew) $('#cDel').onclick = async () => {
    const n = data.logs.filter(l => l.cropId === c.id).length;
    if (!confirm(`「${c.name}」と記録${n}件を削除します。元に戻せません。よろしいですか？`)) return;
    for (const l of data.logs) if (l.cropId === c.id && l.hasPhoto) await kvSet('photo:' + l.id, undefined);
    data.logs = data.logs.filter(l => l.cropId !== c.id);
    data.crops = data.crops.filter(x => x.id !== c.id);
    await save(); closeModal(); go('crops'); toast('削除しました');
  };
}

/* ----- 作業記録の追加・編集 ----- */
async function openLogForm(l) {
  const active = data.crops.filter(c => c.status !== 'done' || c.id === l.cropId);
  if (!active.length) { toast('先に野菜を登録してください'); go('crops'); openCropForm(); return; }
  const isNew = !l.id;
  l = Object.assign({ type: 'water', date: today(), memo: '', amount: '', unit: '個', cropId: active[0].id }, l);
  let photo = l.hasPhoto ? await getPhoto(l.id) : null, photoChanged = false;
  const s = openModal(`<h3>${isNew ? '記録を追加' : '記録を編集'}</h3>
    <label class="f">野菜</label>
    <select id="lCrop">${active.map(c => `<option value="${c.id}" ${c.id === l.cropId ? 'selected' : ''}>${c.emoji} ${esc(c.name)}${c.variety ? '（' + esc(c.variety) + '）' : ''}</option>`).join('')}</select>
    <label class="f">作業</label>
    <div class="pick" id="lType">${Object.entries(TYPES).map(([k, t]) => `<button type="button" data-t="${k}" class="${l.type === k ? 'on' : ''}">${t.icon}${t.label}</button>`).join('')}</div>
    <div id="hvBox">
      <label class="f">収穫量（任意）</label>
      <div class="row"><input type="number" id="lAmt" inputmode="decimal" min="0" step="any" value="${esc(l.amount)}" placeholder="数量" style="flex:2">
      <select id="lUnit" style="flex:1">${UNITS.map(u => `<option ${u === l.unit ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
    </div>
    <label class="f">日付</label><input type="date" id="lDate" value="${esc(l.date)}">
    <label class="f">メモ（任意）</label><textarea id="lMemo" placeholder="例：液肥を500倍で、実が5つ色づいた">${esc(l.memo)}</textarea>
    <label class="f">写真（任意）</label>
    <div class="row"><label class="btn" style="flex:1;text-align:center">📷 撮影・選択<input type="file" id="lPhoto" accept="image/*" hidden></label>
    <button class="btn" id="lPhotoDel" ${photo ? '' : 'hidden'}>写真を外す</button></div>
    <img id="lPrev" class="photo-prev" ${photo ? `src="${photo}"` : 'hidden'} alt="">
    <div class="actions"><button class="btn" id="lCancel">やめる</button><button class="btn primary" id="lSave">${isNew ? '記録' : '保存'}</button></div>
    ${isNew ? '' : '<div style="margin-top:16px"><button class="btn danger block" id="lDel">この記録を削除</button></div>'}`);
  let type = l.type;
  const syncHv = () => { $('#hvBox').hidden = type !== 'harvest'; };
  syncHv();
  s.querySelectorAll('#lType button').forEach(b => b.onclick = () => {
    s.querySelectorAll('#lType button').forEach(x => x.classList.remove('on')); b.classList.add('on'); type = b.dataset.t; syncHv();
  });
  $('#lPhoto').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { photo = await shrinkImage(f); photoChanged = true; $('#lPrev').src = photo; $('#lPrev').hidden = false; $('#lPhotoDel').hidden = false; }
    catch (err) { alert(err.message); }
  };
  $('#lPhotoDel').onclick = () => { photo = null; photoChanged = true; $('#lPrev').hidden = true; $('#lPhotoDel').hidden = true; };
  $('#lCancel').onclick = closeModal;
  $('#lSave').onclick = async () => {
    const date = $('#lDate').value;
    if (!date) { toast('日付を入れてください'); return; }
    const amt = $('#lAmt').value;
    Object.assign(l, {
      cropId: $('#lCrop').value, type, date, memo: $('#lMemo').value.trim(),
      amount: type === 'harvest' && amt !== '' ? Number(amt) : '', unit: $('#lUnit').value
    });
    if (isNew) { l.id = uid(); l.ts = Date.now(); data.logs.push(l); }
    if (photoChanged) {
      if (photo) await setPhoto(l.id, photo); else { await kvSet('photo:' + l.id, undefined); photoCache.delete(l.id); }
      l.hasPhoto = !!photo;
    }
    // 収穫を記録したら「収穫中」に切り替える
    const c = cropById(l.cropId);
    if (type === 'harvest' && c.status === 'growing') c.status = 'harvesting';
    await save(); closeModal(); render();
    toast(`${TYPES[type].icon} ${c.name}：${TYPES[type].label}を${isNew ? '記録' : '保存'}しました`);
  };
  if (!isNew) $('#lDel').onclick = async () => {
    if (!confirm('この記録を削除しますか？')) return;
    if (l.hasPhoto) { await kvSet('photo:' + l.id, undefined); photoCache.delete(l.id); }
    data.logs = data.logs.filter(x => x.id !== l.id);
    await save(); closeModal(); render(); toast('削除しました');
  };
}

/* ===== 起動 ===== */
(async () => {
  await load();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  render();
})();

if ('serviceWorker' in navigator) {
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true; location.reload();
  });
  navigator.serviceWorker.register('./service-worker.js').then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
  }).catch(() => {});
}
</script>
</body>
</html>
